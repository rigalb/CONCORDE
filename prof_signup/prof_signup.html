<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CONCORDE</title>
    <link rel="stylesheet" href="prof_signup/prof_signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="logo-container">
            <div class="logo">📚</div>
            <h1>Bienvenue sur CONCORDE</h1>
            <p class="subtitle">Créez votre compte professeur</p>
        </div>

        <div class="info-box" id="welcome-info">
            <div class="loading">Chargement...</div>
        </div>

        <div id="message" class="message"></div>

        <form id="signup-form" style="display:none;">
            <div class="form-group">
                <label for="username">Nom d'utilisateur <span class="required">*</span></label>
                <input type="text" id="username" required disabled>
                <div class="helper-text">Généré automatiquement depuis votre email</div>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom <span class="required">*</span></label>
                <input type="text" id="prenom" required placeholder="Ex: Pierre">
            </div>

            <div class="form-group">
                <label for="nom">Nom <span class="required">*</span></label>
                <input type="text" id="nom" required placeholder="Ex: Dupont">
            </div>

            <div class="form-group">
                <label for="matiere">Matière enseignée <span class="required">*</span></label>
                <select id="matiere" required>
                    <option value="">-- Sélectionnez une matière --</option>
                    <option value="Mathématiques">Mathématiques</option>
                    <option value="Français">Français</option>
                    <option value="Histoire-Géographie">Histoire-Géographie</option>
                    <option value="Sciences">Sciences (SVT/Physique-Chimie)</option>
                    <option value="Anglais">Anglais</option>
                    <option value="Espagnol">Espagnol</option>
                    <option value="Allemand">Allemand</option>
                    <option value="EPS">EPS (Sport)</option>
                    <option value="Arts Plastiques">Arts Plastiques</option>
                    <option value="Musique">Musique</option>
                    <option value="Technologie">Technologie</option>
                    <option value="Latin">Latin</option>
                    <option value="Grec">Grec</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe <span class="required">*</span></label>
                <input type="password" id="password" required autocomplete="new-password">
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                    <div class="helper-text" id="strength-text">Minimum 8 caractères</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password-confirm">Confirmer le mot de passe <span class="required">*</span></label>
                <input type="password" id="password-confirm" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="classe">Classe principale (optionnel)</label>
                <select id="classe">
                    <option value="">Aucune classe principale</option>
                </select>
                <div class="helper-text">Vous pourrez créer des activités pour toutes les classes</div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Créer mon compte</button>
        </form>
    </div>
    <script src="prof_signup/prof_signup.js"></script>
</body>
</html>
