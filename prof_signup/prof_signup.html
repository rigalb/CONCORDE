<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CONCORDE</title>
    <link rel="stylesheet" href="prof_signup/prof_signup.css">
    <link rel="stylesheet" href="Input_Comp.css">
</head>
<body>
    <div class="signup-container">
        <div class="logo-container">
            <div class="logo">📚</div>
            <h1>Bienvenue sur CONCORDE</h1>
            <p class="subtitle">Créez votre compte professeur</p>
        </div>

        <div class="info-box" id="welcome-info">
            <div class="loading">Chargement...</div>
        </div>

        <div id="message" class="message"></div>

        <form id="signup-form" style="display:none;">
            <div class="form-group">
                <!-- username set dynamiquement via .ic-input#username -->
                <input type="text" id="username" name="username" required disabled
                    data-input-comp='{"label":"Nom d&apos;utilisateur","icon":"user","hint":"Généré automatiquement depuis votre email","disabled":true}'>
            </div>

            <div class="form-group">
                <input type="text" id="prenom" name="prenom" required
                    data-input-comp='{"label":"Prénom","icon":"user","required":true,"placeholder":"Ex: Pierre"}'>
            </div>

            <div class="form-group">
        <input type="text" id="nom" name="nom" required
          data-input-comp='{"label":"Nom","icon":"user","required":true,"placeholder":"Ex: Dupont"}'>
            </div>

            <div class="form-group">
                <!-- Select matière : options statiques, lu via getElementById('matiere').value -->
                <select id="matiere" name="matiere" required
                    data-input-comp='{"label":"Matière enseignée","required":true,"searchable":true}'>
                    <option value="">-- Sélectionnez --</option>
                    <option value="Mathématiques">Mathématiques</option>
                    <option value="Français">Français</option>
                    <option value="Histoire-Géographie">Histoire-Géographie</option>
                    <option value="Sciences">Sciences (SVT/Physique-Chimie)</option>
                    <option value="Anglais">Anglais</option>
                    <option value="Espagnol">Espagnol</option>
                    <option value="Allemand">Allemand</option>
                    <option value="EPS">EPS (Sport)</option>
                    <option value="Arts Plastiques">Arts Plastiques</option>
                    <option value="Musique">Musique</option>
                    <option value="Technologie">Technologie</option>
                    <option value="Latin">Latin</option>
                    <option value="Grec">Grec</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <input type="password" id="password" name="password" required autocomplete="new-password"
                    data-input-comp='{"label":"Mot de passe","icon":"lock","showPassword":true,"required":true}'>                
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                    <div class="helper-text" id="strength-text">Minimum 8 caractères</div>
                </div>
            </div>

            <div class="form-group">
                <input type="password" id="password-confirm" name="password_confirm" required autocomplete="new-password"
                    data-input-comp='{"label":"Confirmer le mot de passe","icon":"lock","showPassword":true,"required":true}'>
            </div>

            <div class="form-group">
        <!-- Select classe : options chargées dynamiquement via classeComp.setOptions() -->
        <select id="classe" name="classe"
          data-input-comp='{"label":"Classe principale (optionnel)","hint":"Vous pourrez créer des activités pour toutes les classes","searchable":true}'>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Créer mon compte</button>
        </form>
    </div>

    <script src="Input_Comp.js"></script>
    <script src="prof_signup/prof_signup.js"></script>
</body>
</html>
